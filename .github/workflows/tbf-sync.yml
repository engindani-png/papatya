name: TBF veri senkronizasyonu

# Duzenli senkronizasyon artik VDS'te calisiyor (evolog-sync.timer, 10 dakikada
# bir) ve veriyi dogrudan yayindaki siteye yaziyor. Bu is akisi yalnizca elle
# calistirmak icin duruyor: depodaki data/league.json dosyasini tazeler.
#
# Zamanlanmis calistirma bilerek kapali -- acik kaldiginda VDS ile ayni anda
# commit atip surekli cakisiyordu.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Yalnizca teshis: API uclarini dene ve ne donuyor yaz"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tbf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Teshis
        run: python3 scripts/tbf_sync.py --probe || true

      - name: TBF verisini cek
        if: ${{ github.event.inputs.probe != 'true' }}
        run: python3 scripts/tbf_sync.py --roster

      - name: Degisiklikleri isle
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          if git diff --quiet -- data/ evolog/logos/; then
            echo "Degisiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ evolog/logos/
          git commit -m "TBF verisi guncellendi ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4; do
            git push && break
            echo "Push basarisiz, tekrar deneniyor..."
            sleep $((2 ** i))
            git pull --rebase --autostash || true
          done
