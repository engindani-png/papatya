name: TBF veri senkronizasyonu

# TBF sayfalarindan puan durumu ve fiksturu cekip data/league.json dosyasini gunceller.
on:
  schedule:
    # Her gun 06:00, 12:00, 18:00 ve 22:00 (TR saati = UTC+3)
    - cron: "0 3,9,15,19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/tbf_config.json"
      - "scripts/tbf_sync.py"
      - ".github/workflows/tbf-sync.yml"

permissions:
  contents: write

concurrency:
  group: tbf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: TBF verisini cek
        run: python3 scripts/tbf_sync.py

      - name: Degisiklikleri isle
        run: |
          if git diff --quiet -- data/league.json; then
            echo "Degisiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league.json
          git commit -m "TBF verisi guncellendi ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4; do
            git push && break
            echo "Push basarisiz, tekrar deneniyor..."
            sleep $((2 ** i))
            git pull --rebase --autostash || true
          done
