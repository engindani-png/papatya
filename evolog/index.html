<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1220">
<meta name="description" content="Evolog U14 Kız Basketbol Takımı - kadro, fikstür, puan durumu ve antrenman programı">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolog U14">
<title>Evolog U14 Kız</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="crest">EVO</div>
  <div>
    <h1>Evolog U14 Kız</h1>
    <div class="sub" id="leagueLabel">TBF İstanbul U14 Kız</div>
  </div>
  <div class="sync" id="syncBox">
    <span><span class="dot off"></span> yükleniyor</span>
  </div>
</header>

<main>
  <!-- MAÇLAR -->
  <section class="panel" id="panel-maclar" role="tabpanel" aria-labelledby="tab-maclar">
    <div id="matchNotice"></div>
    <div id="heroSlot"></div>
    <h2 class="section-title">Yaklaşan Maçlar</h2>
    <div id="upcomingList"></div>
    <h2 class="section-title">Oynanan Maçlar</h2>
    <div id="playedList"></div>
  </section>

  <!-- PUAN DURUMU -->
  <section class="panel" id="panel-puan" role="tabpanel" aria-labelledby="tab-puan" hidden>
    <div id="standingsNotice"></div>
    <h2 class="section-title" id="standingsTitle">Puan Durumu</h2>
    <div id="standingsSlot"></div>
  </section>

  <!-- KADRO -->
  <section class="panel" id="panel-kadro" role="tabpanel" aria-labelledby="tab-kadro" hidden>
    <h2 class="section-title">Kadro</h2>
    <div class="roster" id="rosterSlot"></div>
    <h2 class="section-title">Teknik Kadro</h2>
    <div class="card" id="staffSlot"></div>
  </section>

  <!-- ANTRENMAN -->
  <section class="panel" id="panel-antrenman" role="tabpanel" aria-labelledby="tab-antrenman" hidden>
    <div id="nextTrainingSlot"></div>
    <h2 class="section-title">Haftalık Program</h2>
    <div id="sessionsSlot"></div>
    <h2 class="section-title">Salonlar</h2>
    <div id="venuesSlot"></div>
  </section>

  <footer>
    Maç ve puan durumu verileri TBF kaynaklarından otomatik çekilir.<br>
    Kadro ve antrenman bilgileri <code>data/</code> klasöründen düzenlenir.
  </footer>
</main>

<nav class="tabbar" role="tablist" aria-label="Bölümler">
  <button role="tab" id="tab-maclar" data-panel="maclar" aria-selected="true" aria-controls="panel-maclar">
    <span class="ic" aria-hidden="true">🏀</span>Maçlar
  </button>
  <button role="tab" id="tab-puan" data-panel="puan" aria-selected="false" aria-controls="panel-puan">
    <span class="ic" aria-hidden="true">📊</span>Puan Durumu
  </button>
  <button role="tab" id="tab-kadro" data-panel="kadro" aria-selected="false" aria-controls="panel-kadro">
    <span class="ic" aria-hidden="true">👕</span>Kadro
  </button>
  <button role="tab" id="tab-antrenman" data-panel="antrenman" aria-selected="false" aria-controls="panel-antrenman">
    <span class="ic" aria-hidden="true">📅</span>Antrenman
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
